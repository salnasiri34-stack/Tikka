<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة تكة - الطلبات الفورية</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --primary: #f59e0b; --accent: #10b981; }
    body { font-family: Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }
    header { background: var(--card); padding: 20px; text-align: center; border-bottom: 1px solid #334155; font-size: 22px; font-weight: bold; color: var(--primary); }
    .banner { background: #d97706; color: #000; text-align: center; padding: 10px; font-weight: bold; font-size: 14px; display: none; }
    .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
    h2 { border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 30px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
    .product-card { background: var(--card); border-radius: 10px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; }
    .product-card h3 { margin: 0 0 10px; font-size: 18px; }
    .product-card p { color: var(--muted); font-size: 13px; margin: 0 0 15px; }
    .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .price { font-weight: bold; color: var(--accent); font-size: 16px; }
    .btn { background: var(--primary); color: #000; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn:hover { background: #d97706; }
    .cart-float { position: fixed; bottom: 20px; left: 20px; background: var(--accent); color: #fff; padding: 12px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 10px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; padding: 15px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal input, .modal select { width: 100%; padding: 10px; margin: 8px 0 15px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box; }
    .cart-items-list { max-height: 150px; overflow-y: auto; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
  </style>
</head>
<body>

  <div id="bannerBar" class="banner"></div>
  <header>⚡ منصة تكة الفورية</header>

  <div class="container">
    <h2>قائمة المنتجات</h2>
    <div id="productsGrid" class="products-grid">
      <!-- المنتجات تظهر هنا تلقائياً -->
    </div>
  </div>

  <!-- زر السلة المعلق -->
  <div class="cart-float" id="openCartBtn">
    <i class="fas fa-shopping-cart"></i> السلة (<span id="cartCount">0</span>)
  </div>

  <!-- نافذة إتمام الطلب (السلة) -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal">
      <h3>إتمام الطلب</h3>
      <div class="cart-items-list" id="cartItemsList"></div>
      <div style="font-weight: bold; margin-bottom: 15px;">المجموع الكلي: <span id="cartTotal">0</span> ر.س</div>
      
      <label>اسم العميل</label>
      <input type="text" id="custName" placeholder="اكتب اسمك هنا">
      
      <label>رقم الجوال</label>
      <input type="text" id="custPhone" placeholder="05xxxxxxxx">
      
      <label>العنوان / الموقع</label>
      <input type="text" id="custAddress" placeholder="المدينة المنورة، الحي...">

      <label>طريقة الدفع</label>
      <select id="paymentMethod">
        <option value="cash">الدفع عند الاستلام</option>
        <option value="apple_pay">🍎 Apple Pay</option>
      </select>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button id="submitOrderBtn" class="btn" style="flex: 1; background: var(--accent); color: #fff;">تأكيد الطلب</button>
        <button id="closeCartBtn" class="btn" style="flex: 1; background: #ef4444; color: #fff;">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    let products = [];
    let cart = [];

    async function loadStoreData() {
      // جلب الإعدادات والبانر
      const settingsRes = await fetch('/api/settings');
      const settings = await settingsRes.json();
      if (settings.banners && settings.banners[0] && settings.banners[0].active) {
        const bar = document.getElementById('bannerBar');
        bar.textContent = settings.banners[0].text;
        bar.style.display = 'block';
      }

      // جلب المنتجات
      const prodRes = await fetch('/api/products');
      products = await prodRes.json();
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';
      products.forEach(p => {
        grid.innerHTML += `
          <div class="product-card">
            <div>
              <h3>${p.name}</h3>
              <p>${p.description || ''}</p>
            </div>
            <div class="price-row">
              <span class="price">${p.price} ر.س</span>
              <button class="btn" onclick="addToCart('${p.id}')">إضافة للسلة</button>
            </div>
          </div>
        `;
      });
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;
      const existing = cart.find(i => i.id === id);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 });
      }
      updateCartUI();
    }

    function updateCartUI() {
      const count = cart.reduce((sum, i) => sum + i.qty, 0);
      document.getElementById('cartCount').textContent = count;
      
      const list = document.getElementById('cartItemsList');
      list.innerHTML = '';
      let total = 0;
      cart.forEach(item => {
        total += item.price * item.qty;
        list.innerHTML += `<div class="cart-item"><span>${item.name} (×${item.qty})</span><span>${item.price * item.qty} ر.س</span></div>`;
      });
      document.getElementById('cartTotal').textContent = total;
    }

    document.getElementById('openCartBtn').addEventListener('click', () => {
      if (cart.length === 0) {
        alert('السلة فارغة!');
        return;
      }
      document.getElementById('cartModal').classList.add('open');
    });

    document.getElementById('closeCartBtn').addEventListener('click', () => {
      document.getElementById('cartModal').classList.remove('open');
    });

    document.getElementById('submitOrderBtn').addEventListener('click', async () => {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const paymentMethod = document.getElementById('paymentMethod').value;

      if (!name || !phone || !address) {
        alert('يرجى تعبئة جميع بيانات العميل والعنوان');
        return;
      }

      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customer: { name, phone, address },
          items: cart,
          total,
          paymentMethod
        })
      });

      const data = await res.json();
      if (data.success) {
        alert('تم إرسال طلبك بنجاح! سيتم تجهيزه فوراً.');
        cart = [];
        updateCartUI();
        document.getElementById('cartModal').classList.remove('open');
      } else {
        alert('حدث خطأ، حاول مرة أخرى');
      }
    });

    loadStoreData();
  </script>
</body>
</html>
